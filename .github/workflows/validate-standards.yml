name: Validate organisation standards

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile validator
        run: python -m py_compile tools/validate_standards.py tests/test_validate_standards.py

      - name: Run validator tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate repository standards
        run: python tools/validate_standards.py
