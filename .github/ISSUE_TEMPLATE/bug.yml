name: Defect report
description: Report a reproducible problem in a Ritru product, blueprint, architecture, workflow, or repository.
title: "[Defect]: "
body:
  - type: markdown
    attributes:
      value: Do not include credentials, customer-confidential information, private endpoints, or personal data.
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
      description: What happened instead? Include sanitised evidence.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe and repeatable reproduction.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and scope
      description: Which users, workflows, environments, versions, or customers may be affected?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation evidence
      description: Add sanitised logs, test output, workflow references, or screenshots.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets, customer identifiers, and sensitive environment details.
          required: true
        - label: I checked whether immediate containment or rollback is required.
          required: true
